<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Карточки</title>
<style>
:root{--bg:#0f0f12;--bg2:#18181d;--bg3:#22222a;--text:#f0f0f5;--text2:#8a8a95;--accent:#7c5cff;--green:#22c55e;--blue:#3b82f6;--orange:#f59e0b;--red:#ef4444;--border:#2a2a35}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:16px;outline:none;border:none;background:none;color:inherit;width:100%}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;min-height:60px}
.header h1{font-size:18px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:background .15s}
.icon-btn:active{background:var(--bg3)}
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Decks list */
.deck{background:var(--bg2);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .1s,background .15s;border:1px solid var(--border)}
.deck:active{transform:scale(.98);background:var(--bg3)}
.deck-icon{width:48px;height:48px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.deck-info{flex:1;overflow:hidden}
.deck-name{font-weight:600;font-size:16px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-meta{font-size:12px;color:var(--text2);display:flex;gap:8px}
.deck-meta .due{color:var(--accent);font-weight:600}
.deck-arrow{color:var(--text2);font-size:20px;flex-shrink:0}
.empty{text-align:center;color:var(--text2);padding:60px 20px;font-size:14px;line-height:1.6}

/* Buttons */
.btn{width:100%;padding:16px;background:var(--accent);color:#fff;border-radius:14px;font-weight:600;font-size:16px;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.97);opacity:.9}
.btn-sec{background:var(--bg3);color:var(--text)}
.btn-danger{background:var(--red)}
.btn-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));right:20px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(124,92,255,.4);z-index:10;transition:transform .1s}
.btn-fab:active{transform:scale(.92)}

/* Study */
.study-wrap{flex:1;display:flex;flex-direction:column;padding:16px;gap:16px;overflow:hidden}
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;flex-shrink:0}
.progress-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:3px}
.card-counter{text-align:center;font-size:13px;color:var(--text2);flex-shrink:0}
.card{flex:1;background:var(--bg2);border-radius:22px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:28px 24px;text-align:center;font-size:22px;line-height:1.5;cursor:pointer;position:relative;overflow:hidden;min-height:0}
.card.flipped{background:var(--bg3)}
.card-content{width:100%;word-break:break-word;-webkit-user-select:text;user-select:text}
.card-content img{max-width:100%;max-height:200px;border-radius:12px;margin:10px auto;display:block}
.card-label{position:absolute;top:14px;left:14px;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.card-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--text2);pointer-events:none}
.rating-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-shrink:0}
.rating-btn{padding:14px 6px;border-radius:14px;font-weight:600;font-size:13px;color:#fff;transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:4px}
.rating-btn:active{transform:scale(.94)}
.rating-btn span:first-child{font-size:18px}
.rating-btn[data-r="0"]{background:var(--red)}
.rating-btn[data-r="1"]{background:var(--orange)}
.rating-btn[data-r="2"]{background:var(--blue)}
.rating-btn[data-r="3"]{background:var(--green)}
.rating-btn small{font-size:10px;opacity:.85;font-weight:400}
.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;gap:16px}
.done-screen .emoji{font-size:80px}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{background:var(--bg3);border-radius:12px;padding:14px 16px;border:1.5px solid transparent;transition:border-color .2s;font-size:16px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:90px;font-family:inherit}

/* Card list (for edit) */
.card-item{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:8px;border:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.card-item-info{flex:1;overflow:hidden;min-width:0}
.card-item-q{font-weight:600;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-item-a{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-item-del{width:34px;height:34px;border-radius:50%;background:var(--bg3);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end}
.modal.active{display:flex}
.modal-inner{background:var(--bg2);border-radius:22px 22px 0 0;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom));width:100%;max-height:85vh;overflow-y:auto;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:18px;margin-bottom:16px;font-weight:700}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg3);color:var(--text);padding:12px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:all .3s;border:1px solid var(--border);max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:var(--bg2);border-radius:14px;padding:14px;border:1px solid var(--border);text-align:center}
.stat-value{font-size:24px;font-weight:700;color:var(--accent);margin-bottom:4px}
.stat-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:600}

@media (min-width:600px){
  .content{max-width:640px;margin:0 auto;width:100%}
  .study-wrap{max-width:640px;margin:0 auto;width:100%}
}
</style>
</head>
<body>

<!-- Decks screen -->
<div class="screen active" id="decksScreen">
  <div class="header">
    <h1>📚 Мои колоды</h1>
    <button class="icon-btn" onclick="openStats()" title="Статистика">📊</button>
  </div>
  <div class="content" id="decksList"></div>
  <button class="btn-fab" onclick="openDeckModal()">＋</button>
</div>

<!-- Deck detail screen -->
<div class="screen" id="deckScreen">
  <div class="header">
    <button class="icon-btn" onclick="backToDecks()">←</button>
    <h1 id="deckTitle">Колода</h1>
    <button class="icon-btn" onclick="openRenameModal()" title="Переименовать">✏️</button>
    <button class="icon-btn" onclick="deleteDeck()" title="Удалить">🗑️</button>
  </div>
  <div class="content">
    <div id="deckStats" class="stats-grid"></div>
    <button class="btn" onclick="startStudy()" id="studyBtn" style="margin-bottom:16px">▶ Учить</button>
    <h3 style="font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px">Карточки (<span id="cardCount">0</span>)</h3>
    <div id="cardsList"></div>
    <button class="btn btn-sec" onclick="openCardModal()" style="margin-top:8px">＋ Добавить карточку</button>
  </div>
</div>

<!-- Study screen -->
<div class="screen" id="studyScreen">
  <div class="study-wrap">
    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
      <button class="icon-btn" onclick="exitStudy()" style="margin-left:-10px">✕</button>
      <div class="progress-bar" style="flex:1"><div class="progress-fill" id="studyProgress" style="width:0%"></div></div>
    </div>
    <div class="card-counter" id="studyCounter">0 / 0</div>
    <div class="card" id="studyCard" onclick="flipCard()">
      <div class="card-label" id="cardLabel">ВОПРОС</div>
      <div class="card-content" id="cardContent"></div>
      <div class="card-hint" id="cardHint">нажми, чтобы увидеть ответ</div>
    </div>
    <div class="rating-buttons" id="ratingButtons" style="visibility:hidden">
      <button class="rating-btn" data-r="0" onclick="rate(0)"><span>😵</span><small id="i0"></small></button>
      <button class="rating-btn" data-r="1" onclick="rate(1)"><span>😐</span><small id="i1"></small></button>
      <button class="rating-btn" data-r="2" onclick="rate(2)"><span>🙂</span><small id="i2"></small></button>
      <button class="rating-btn" data-r="3" onclick="rate(3)"><span>😎</span><small id="i3"></small></button>
    </div>
  </div>
</div>

<!-- Deck modal (create/rename) -->
<div class="modal" id="deckModal" onclick="if(event.target===this)closeModal('deckModal')">
  <div class="modal-inner">
    <h2 id="deckModalTitle">Новая колода</h2>
    <div class="field">
      <label>Название</label>
      <input id="deckNameInput" placeholder="Например: Английский" autofocus>
    </div>
    <div class="field">
      <label>Эмодзи</label>
      <input id="deckIconInput" placeholder="📚" maxlength="4" value="📚">
    </div>
    <button class="btn" onclick="saveDeck()">Сохранить</button>
  </div>
</div>

<!-- Card modal -->
<div class="modal" id="cardModal" onclick="if(event.target===this)closeModal('cardModal')">
  <div class="modal-inner">
    <h2>Новая карточка</h2>
    <div class="field">
      <label>Вопрос (лицевая сторона)</label>
      <textarea id="cardQ" placeholder="Что нужно вспомнить?"></textarea>
    </div>
    <div class="field">
      <label>Ответ (обратная сторона)</label>
      <textarea id="cardA" placeholder="Правильный ответ"></textarea>
    </div>
    <button class="btn" onclick="saveCard()">Сохранить</button>
  </div>
</div>

<!-- Stats modal -->
<div class="modal" id="statsModal" onclick="if(event.target===this)closeModal('statsModal')">
  <div class="modal-inner">
    <h2>📊 Статистика</h2>
    <div id="statsContent"></div>
    <button class="btn btn-sec" onclick="closeModal('statsModal')" style="margin-top:12px">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
let state = { decks: [], stats: { reviews: 0, days: {}, streak: 0, lastDay: null } };
let currentDeckId = null;
let editingDeckId = null;
let studyQueue = [];
let studyIndex = 0;
let isFlipped = false;

// ============ STORAGE ============
function load() {
  try {
    const raw = localStorage.getItem('flashcards_v1');
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
  if (!state.decks) state.decks = [];
  if (!state.stats) state.stats = { reviews: 0, days: {}, streak: 0, lastDay: null };
}
function save() {
  localStorage.setItem('flashcards_v1', JSON.stringify(state));
}

// ============ UTILS ============
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function daysBetween(a, b) {
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}
function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function mdLite(text) {
  // Support basic markdown: **bold**, *italic*, ![img](url), line breaks
  let s = esc(text);
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/\*([^*]+)\*/g, '<i>$1</i>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

// ============ MODAL ============
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ============ DECKS ============
function renderDecks() {
  const list = document.getElementById('decksList');
  if (state.decks.length === 0) {
    list.innerHTML = '<div class="empty">Пока нет колод.<br>Нажми <b>＋</b> чтобы создать первую.</div>';
    return;
  }
  const t = today();
  list.innerHTML = state.decks.map(d => {
    const due = d.cards.filter(c => c.due <= t).length;
    const total = d.cards.length;
    const learned = d.cards.filter(c => c.interval >= 21).length;
    return `<div class="deck" onclick="openDeck('${d.id}')">
      <div class="deck-icon">${esc(d.icon || '📚')}</div>
      <div class="deck-info">
        <div class="deck-name">${esc(d.name)}</div>
        <div class="deck-meta">
          <span>${total} карт.</span>
          ${learned > 0 ? `<span>· ${learned} выучено</span>` : ''}
          ${due > 0 ? `<span class="due">· ${due} к повторению</span>` : ''}
        </div>
      </div>
      <div class="deck-arrow">›</div>
    </div>`;
  }).join('');
}

function openDeckModal(deckId) {
  editingDeckId = deckId || null;
  const d = deckId ? state.decks.find(x => x.id === deckId) : null;
  document.getElementById('deckModalTitle').textContent = deckId ? 'Переименовать колоду' : 'Новая колода';
  document.getElementById('deckNameInput').value = d ? d.name : '';
  document.getElementById('deckIconInput').value = d ? (d.icon || '📚') : '📚';
  openModal('deckModal');
  setTimeout(() => document.getElementById('deckNameInput').focus(), 100);
}

function saveDeck() {
  const name = document.getElementById('deckNameInput').value.trim();
  const icon = document.getElementById('deckIconInput').value.trim() || '📚';
  if (!name) { toast('Введи название'); return; }
  if (editingDeckId) {
    const d = state.decks.find(x => x.id === editingDeckId);
    d.name = name;
    d.icon = icon;
    toast('Обновлено');
  } else {
    state.decks.push({ id: uid(), name, icon, cards: [], created: today() });
    toast('Колода создана');
  }
  save();
  closeModal('deckModal');
  renderDecks();
  if (currentDeckId) renderDeckDetail();
}

function deleteDeck() {
  if (!currentDeckId) return;
  const d = state.decks.find(x => x.id === currentDeckId);
  if (!d) return;
  if (!confirm(`Удалить колоду "${d.name}" и все ${d.cards.length} карточек?`)) return;
  state.decks = state.decks.filter(x => x.id !== currentDeckId);
  save();
  backToDecks();
  toast('Удалено');
}

function openRenameModal() {
  openDeckModal(currentDeckId);
}

// ============ DECK DETAIL ============
function openDeck(deckId) {
  currentDeckId = deckId;
  const d = state.decks.find(x => x.id === deckId);
  if (!d) return;
  document.getElementById('deckTitle').textContent = (d.icon || '📚') + ' ' + d.name;
  show('deckScreen');
  renderDeckDetail();
}

function renderDeckDetail() {
  const d = state.decks.find(x => x.id === currentDeckId);
  if (!d) return;
  const t = today();
  const due = d.cards.filter(c => c.due <= t).length;
  const learned = d.cards.filter(c => c.interval >= 21).length;
  const avgInterval = d.cards.length ? Math.round(d.cards.reduce((s,c) => s + (c.interval||0), 0) / d.cards.length) : 0;

  document.getElementById('deckStats').innerHTML = `
    <div class="stat"><div class="stat-value">${d.cards.length}</div><div class="stat-label">Всего</div></div>
    <div class="stat"><div class="stat-value">${due}</div><div class="stat-label">К повтор.</div></div>
    <div class="stat"><div class="stat-value">${learned}</div><div class="stat-label">Выучено</div></div>
    <div class="stat"><div class="stat-value">${avgInterval}д</div><div class="stat-label">Ср. интервал</div></div>
  `;

  document.getElementById('cardCount').textContent = d.cards.length;
  const studyBtn = document.getElementById('studyBtn');
  if (d.cards.length === 0) {
    studyBtn.disabled = true;
    studyBtn.textContent = 'Нет карточек';
    studyBtn.style.opacity = '.5';
  } else if (due === 0) {
    studyBtn.disabled = false;
    studyBtn.textContent = '✓ Все повторено · учить досрочно';
    studyBtn.style.opacity = '1';
  } else {
    studyBtn.disabled = false;
    studyBtn.textContent = `▶ Учить (${due})`;
    studyBtn.style.opacity = '1';
  }

  const list = document.getElementById('cardsList');
  if (d.cards.length === 0) {
    list.innerHTML = '<div class="empty" style="padding:30px 20px">Пусто. Добавь первую карточку.</div>';
  } else {
    list.innerHTML = d.cards.map(c => `
      <div class="card-item">
        <div class="card-item-info">
          <div class="card-item-q">${esc(c.q)}</div>
          <div class="card-item-a">${esc(c.a)}</div>
        </div>
        <button class="card-item-del" onclick="deleteCard('${c.id}')">✕</button>
      </div>
    `).join('');
  }
}

function backToDecks() {
  currentDeckId = null;
  show('decksScreen');
  renderDecks();
}

// ============ CARDS ============
function openCardModal() {
  document.getElementById('cardQ').value = '';
  document.getElementById('cardA').value = '';
  openModal('cardModal');
  setTimeout(() => document.getElementById('cardQ').focus(), 100);
}

function saveCard() {
  const q = document.getElementById('cardQ').value.trim();
  const a = document.getElementById('cardA').value.trim();
  if (!q || !a) { toast('Заполни оба поля'); return; }
  const d = state.decks.find(x => x.id === currentDeckId);
  if (!d) return;
  d.cards.push({
    id: uid(),
    q, a,
    interval: 0,
    ease: 2.5,
    due: today(),
    lapses: 0,
    reps: 0,
    created: today()
  });
  save();
  closeModal('cardModal');
  renderDeckDetail();
  toast('Добавлено');
}

function deleteCard(cardId) {
  const d = state.decks.find(x => x.id === currentDeckId);
  if (!d) return;
  if (!confirm('Удалить карточку?')) return;
  d.cards = d.cards.filter(c => c.id !== cardId);
  save();
  renderDeckDetail();
}

// ============ STUDY ============
function startStudy() {
  const d = state.decks.find(x => x.id === currentDeckId);
  if (!d || d.cards.length === 0) return;
  const t = today();
  // Due cards first, then new ones, sorted by due date
  const due = d.cards.filter(c => c.due <= t).sort((a,b) => (a.due > b.due ? 1 : -1));
  // If nothing due, study all (cram mode)
  studyQueue = due.length > 0 ? [...due] : [...d.cards].sort(() => Math.random() - 0.5).slice(0, 20);
  studyIndex = 0;
  show('studyScreen');
  renderStudy();
}

function renderStudy() {
  const card = studyQueue[studyIndex];
  if (!card) { finishStudy(); return; }

  isFlipped = false;
  document.getElementById('cardLabel').textContent = 'ВОПРОС';
  document.getElementById('cardContent').innerHTML = mdLite(card.q);
  document.getElementById('cardHint').textContent = 'нажми, чтобы увидеть ответ';
  document.getElementById('studyCard').classList.remove('flipped');
  document.getElementById('ratingButtons').style.visibility = 'hidden';

  const total = studyQueue.length;
  document.getElementById('studyCounter').textContent = `${studyIndex + 1} / ${total}`;
  document.getElementById('studyProgress').style.width = `${(studyIndex / total) * 100}%`;

  // Precompute next intervals for labels
  updateIntervalLabels(card);
}

function updateIntervalLabels(card) {
  const labels = getIntervals(card);
  for (let i = 0; i < 4; i++) {
    document.getElementById('i' + i).textContent = labels[i];
  }
}

function getIntervals(card) {
  const e = card.ease || 2.5;
  const iv = card.interval || 0;
  const out = [];
  // Again
  out.push('<1д');
  // Hard
  if (iv === 0) out.push('1д');
  else out.push(Math.max(1, Math.round(iv * 1.2)) + 'д');
  // Good
  if (iv === 0) out.push('1д');
  else if (iv === 1) out.push('3д');
  else out.push(Math.round(iv * e) + 'д');
  // Easy
  if (iv === 0) out.push('3д');
  else out.push(Math.round(iv * e * 1.3) + 'д');
  return out;
}

function flipCard() {
  if (isFlipped) return;
  isFlipped = true;
  const card = studyQueue[studyIndex];
  document.getElementById('cardLabel').textContent = 'ОТВЕТ';
  document.getElementById('cardContent').innerHTML = mdLite(card.a);
  document.getElementById('cardHint').textContent = '';
  document.getElementById('studyCard').classList.add('flipped');
  document.getElementById('ratingButtons').style.visibility = 'visible';
}

function rate(r) {
  if (!isFlipped) return;
  const card = studyQueue[studyIndex];
  if (!card) return;
  const d = state.decks.find(x => x.id === currentDeckId);
  const dbCard = d.cards.find(c => c.id === card.id);
  const t = today();

  dbCard.reps = (dbCard.reps || 0) + 1;

  if (r === 0) {
    // Again
    dbCard.interval = 0;
    dbCard.ease = Math.max(1.3, (dbCard.ease || 2.5) - 0.2);
    dbCard.lapses = (dbCard.lapses || 0) + 1;
    dbCard.due = t;
  } else if (r === 1) {
    // Hard
    dbCard.ease = Math.max(1.3, (dbCard.ease || 2.5) - 0.15);
    dbCard.interval = dbCard.interval === 0 ? 1 : Math.max(1, Math.round(dbCard.interval * 1.2));
    dbCard.due = addDays(t, dbCard.interval);
  } else if (r === 2) {
    // Good
    if (dbCard.interval === 0) dbCard.interval = 1;
    else if (dbCard.interval === 1) dbCard.interval = 3;
    else dbCard.interval = Math.round(dbCard.interval * (dbCard.ease || 2.5));
    dbCard.due = addDays(t, dbCard.interval);
  } else {
    // Easy
    if (dbCard.interval === 0) dbCard.interval = 3;
    else dbCard.interval = Math.round(dbCard.interval * (dbCard.ease || 2.5) * 1.3);
    dbCard.ease = Math.min(3.5, (dbCard.ease || 2.5) + 0.1);
    dbCard.due = addDays(t, dbCard.interval);
  }

  // Global stats
  state.stats.reviews = (state.stats.reviews || 0) + 1;
  const td = today();
  state.stats.days[td] = (state.stats.days[td] || 0) + 1;
  if (state.stats.lastDay !== td) {
    const y = addDays(td, -1);
    if (state.stats.lastDay === y) state.stats.streak = (state.stats.streak || 0) + 1;
    else state.stats.streak = 1;
    state.stats.lastDay = td;
  }

  save();

  studyIndex++;
  if (studyIndex >= studyQueue.length) finishStudy();
  else renderStudy();
}

function finishStudy() {
  document.getElementById('studyProgress').style.width = '100%';
  const total = studyQueue.length;
  document.querySelector('.study-wrap').innerHTML = `
    <div class="done-screen">
      <div class="emoji">🎉</div>
      <h2>Готово!</h2>
      <p style="color:var(--text2)">Повторено карточек: <b style="color:var(--text)">${total}</b></p>
      <button class="btn" onclick="exitStudy()" style="max-width:280px;margin-top:20px">Вернуться к колоде</button>
    </div>
  `;
}

function exitStudy() {
  // Restore study screen DOM
  const wrap = document.querySelector('.study-wrap');
  wrap.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
      <button class="icon-btn" onclick="exitStudy()" style="margin-left:-10px">✕</button>
      <div class="progress-bar" style="flex:1"><div class="progress-fill" id="studyProgress" style="width:0%"></div></div>
    </div>
    <div class="card-counter" id="studyCounter">0 / 0</div>
    <div class="card" id="studyCard" onclick="flipCard()">
      <div class="card-label" id="cardLabel">ВОПРОС</div>
      <div class="card-content" id="cardContent"></div>
      <div class="card-hint" id="cardHint">нажми, чтобы увидеть ответ</div>
    </div>
    <div class="rating-buttons" id="ratingButtons" style="visibility:hidden">
      <button class="rating-btn" data-r="0" onclick="rate(0)"><span>😵</span><small id="i0"></small></button>
      <button class="rating-btn" data-r="1" onclick="rate(1)"><span>😐</span><small id="i1"></small></button>
      <button class="rating-btn" data-r="2" onclick="rate(2)"><span>🙂</span><small id="i2"></small></button>
      <button class="rating-btn" data-r="3" onclick="rate(3)"><span>😎</span><small id="i3"></small></button>
    </div>
  `;
  currentDeckId && openDeck(currentDeckId);
}

// ============ STATS ============
function openStats() {
  const total = state.decks.reduce((s, d) => s + d.cards.length, 0);
  const learned = state.decks.reduce((s, d) => s + d.cards.filter(c => c.interval >= 21).length, 0);
  const t = today();
  const dueToday = state.decks.reduce((s, d) => s + d.cards.filter(c => c.due <= t).length, 0);
  const reviews = state.stats.reviews || 0;
  const streak = state.stats.streak || 0;

  // Last 30 days
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = addDays(t, -i);
    days.push({ d, n: state.stats.days[d] || 0 });
  }
  const maxN = Math.max(1, ...days.map(x => x.n));
  const bars = days.map(x => {
    const h = Math.round((x.n / maxN) * 60);
    return `<div style="flex:1;height:60px;display:flex;align-items:flex-end;background:var(--bg3);border-radius:3px;overflow:hidden" title="${x.d}: ${x.n}">
      <div style="width:100%;height:${h}px;background:${x.n > 0 ? 'var(--accent)' : 'transparent'};border-radius:3px"></div>
    </div>`;
  }).join('');

  document.getElementById('statsContent').innerHTML = `
    <div class="stats-grid">
      <div class="stat"><div class="stat-value">${total}</div><div class="stat-label">Всего карт</div></div>
      <div class="stat"><div class="stat-value">${learned}</div><div class="stat-label">Выучено</div></div>
      <div class="stat"><div class="stat-value">${dueToday}</div><div class="stat-label">К повторению</div></div>
      <div class="stat"><div class="stat-value">🔥 ${streak}</div><div class="stat-label">Дней подряд</div></div>
    </div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:8px">Повторено всего: <b style="color:var(--text)">${reviews}</b></div>
    <div style="font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:16px 0 8px">Последние 30 дней</div>
    <div style="display:flex;gap:2px;align-items:flex-end">${bars}</div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:6px"><span>30 дн. назад</span><span>сегодня</span></div>
    <div style="margin-top:20px">
      <button class="btn btn-sec" onclick="exportData()">📤 Экспорт данных</button>
      <button class="btn btn-sec" onclick="importData()" style="margin-top:8px">📥 Импорт данных</button>
      <button class="btn btn-danger" onclick="resetAll()" style="margin-top:8px">🗑️ Сбросить всё</button>
    </div>
  `;
  openModal('statsModal');
}

// ============ IMPORT/EXPORT ============
function exportData() {
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'flashcards_' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Скачано');
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        if (!parsed.decks || !Array.isArray(parsed.decks)) throw new Error('bad format');
        if (!confirm(`Импортировать ${parsed.decks.length} колод? Текущие данные будут заменены.`)) return;
        state = parsed;
        save();
        renderDecks();
        closeModal('statsModal');
        toast('Импортировано');
      } catch(err) {
        toast('Ошибка чтения файла');
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

function resetAll() {
  if (!confirm('Удалить ВСЕ колоды и статистику?')) return;
  if (!confirm('Точно?')) return;
  state = { decks: [], stats: { reviews: 0, days: {}, streak: 0, lastDay: null } };
  save();
  closeModal('statsModal');
  renderDecks();
  toast('Сброшено');
}

// ============ NAVIGATION ============
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// System back button
window.addEventListener('popstate', () => {
  const active = document.querySelector('.modal.active');
  if (active) { active.classList.remove('active'); history.pushState(null, ''); return; }
  const screen = document.querySelector('.screen.active');
  if (screen && screen.id === 'studyScreen') { exitStudy(); history.pushState(null, ''); return; }
  if (screen && screen.id === 'deckScreen') { backToDecks(); history.pushState(null, ''); return; }
});
history.pushState(null, '');

// ============ INIT ============
load();
renderDecks();
</script>
</body>
